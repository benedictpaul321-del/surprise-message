<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise for Oviya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9ef;--bg2:#ffd3b0;--ink:#4a1d3b;--soft:#7a4a68;--card:rgba(255,255,255,.7);--pop:#e63e6d;--gold:#f2a007;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1238;--bg2:#4a1d3b;--ink:#fff1dc;--soft:#e6c3d8;--card:rgba(255,255,255,.1);--pop:#ff7a9c;--gold:#ffc23d}}
:root[data-theme="dark"]{--bg1:#2a1238;--bg2:#4a1d3b;--ink:#fff1dc;--soft:#e6c3d8;--card:rgba(255,255,255,.1);--pop:#ff7a9c;--gold:#ffc23d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;font-weight:500;line-height:1.55;overflow-x:hidden}
canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 20px 60px}
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hello{font-size:1.2rem;color:var(--soft);margin:0 0 6px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(3.6rem,19vw,8rem);line-height:1;margin:0;color:var(--pop);display:flex;justify-content:center}
h1 span{display:inline-block;animation:drop .9s cubic-bezier(.3,1.6,.5,1) both,wave 3s ease-in-out 1.6s infinite;animation-delay:calc(var(--i)*.14s),calc(1.6s + var(--i)*.18s)}
@keyframes drop{from{transform:translateY(-120px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-3deg)}}
.sub{font-size:1.25rem;max-width:30ch;margin:18px auto 28px}
button{font:inherit;font-weight:700;cursor:pointer;border:0}
.cta{background:var(--pop);color:#fff;padding:14px 28px;border-radius:999px;font-size:1.1rem;box-shadow:0 8px 24px rgba(230,62,109,.35);transition:transform .15s}
.cta:hover{transform:scale(1.05)}.cta:active{transform:scale(.96)}
.cta:focus-visible,.balloon:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#more{display:none}
section{background:var(--card);backdrop-filter:blur(8px);border-radius:24px;padding:24px;margin-top:22px}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;margin:0 0 6px}
p{margin:0 0 12px}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
#arena{position:relative;height:340px;border-radius:18px;overflow:hidden;background:linear-gradient(#ffffff33,#ffffff08);touch-action:manipulation}
.balloon{position:absolute;top:100%;background:none;font-size:2.6rem;padding:0;line-height:1;animation:rise linear forwards}
@keyframes rise{to{top:-70px}}
#toast{min-height:1.6em;text-align:center;font-weight:700;color:var(--pop);margin-top:10px}
#smile{font-size:1.35rem;min-height:3.6em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700}
.note{white-space:pre-line;font-size:1.1rem}
.sign{text-align:right;font-family:'Fraunces',Georgia,serif;font-weight:700;color:var(--pop);margin:0}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}.balloon{animation-duration:12s!important}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<main>
  <div class="hero">
    <p class="hello">Hey you, yes, you…</p>
    <h1 id="name" aria-label="Oviya"></h1>
    <p class="sub">Somebody made this page just to make you smile today.</p>
    <button class="cta" id="open">Open your surprise</button>
  </div>

  <div id="more">
    <section>
      <h2>Pop the balloons</h2>
      <p>You have 25 seconds. Every balloon you pop comes with a little something nice.</p>
      <div class="bar"><span>Popped: <b id="score">0</b></span><span>Time: <b id="time">25</b>s</span></div>
      <div id="arena"></div>
      <div id="toast"></div>
      <button class="cta" id="start" style="margin-top:8px">Start game</button>
    </section>

    <section>
      <h2>Need a smile?</h2>
      <div id="smile">Tap the button. Go on.</div>
      <div style="text-align:center"><button class="cta" id="smileBtn">Make me smile</button></div>
    </section>

    <section>
      <h2>One more thing</h2>
      <p class="note" id="note"></p>
      <p class="sign" id="sign"></p>
    </section>
  </div>
</main>

<script>
// ===== Edit these to personalise =====
var NAME = "Oviya";
var FROM = "Bene";
var NOTE = "I hope your day is as bright as your smile.\nThank you for being such a good friend. The world is nicer with you in it.\nNever forget how amazing you are!";
var COMPLIMENTS = [
  "You light up every room you walk into.",
  "Your smile could power a small city.",
  "You’re the kind of friend everyone wishes they had.",
  "Fun fact: you’re 100% awesome. Scientists checked.",
  "Why did the cookie go to the doctor? It felt crumby. Now smile!",
  "You make ordinary days feel special.",
  "Somewhere right now, someone is lucky to know you.",
  "Warning: this much kindness may cause happiness.",
  "You’re doing better than you think. Keep shining!"
];
// =====================================

var $ = function(id){return document.getElementById(id)};
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Name letters
NAME.split("").forEach(function(ch,i){
  var s=document.createElement("span"); s.textContent=ch; s.style.setProperty("--i",i); $("name").appendChild(s);
});
$("name").setAttribute("aria-label",NAME);
document.title="A little surprise for "+NAME;
$("note").textContent="Dear "+NAME+",\n"+NOTE;
$("sign").textContent="— "+FROM;

// Falling petals background
var cv=$("petals"),cx=cv.getContext("2d"),W,H,petals=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener("resize",size);
var cols=["#ff9bb3","#ffc23d","#ffd9e2","#ff7a9c","#ffe08a"];
for(var i=0;i<(reduce?10:34);i++)petals.push({x:Math.random()*W,y:Math.random()*H,r:5+Math.random()*7,v:.4+Math.random()*.9,d:Math.random()*6,c:cols[i%cols.length]});
function draw(){
  cx.clearRect(0,0,W,H);
  petals.forEach(function(p){
    p.y+=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.7;
    if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.d);cx.fillStyle=p.c;cx.globalAlpha=.75;
    cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);cx.fill();cx.restore();
  });
  requestAnimationFrame(draw);
}
draw();

// Confetti burst
function burst(x,y){
  var em=["💖","✨","🌸","💛","⭐"];
  for(var i=0;i<8;i++){
    var e=document.createElement("div");
    e.textContent=em[i%em.length];
    e.style.cssText="position:fixed;z-index:9;pointer-events:none;font-size:1.3rem;left:"+x+"px;top:"+y+"px";
    document.body.appendChild(e);
    var a=Math.random()*Math.PI*2,d=50+Math.random()*70;
    var anim=e.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d-30)+"px) scale(.4)",opacity:0}],{duration:800,easing:"ease-out"});
    anim.onfinish=(function(el){return function(){el.remove()}})(e);
  }
}

// Open surprise
$("open").onclick=function(e){
  $("more").style.display="block";
  burst(e.clientX,e.clientY);
  $("more").scrollIntoView({behavior:reduce?"auto":"smooth"});
};

// Balloon game
var score=0,left=25,tick,spawner,running=false;
var kind=["🎈","🎈","🌸","💛","⭐","🌼","💖"];
var praise=["You’re amazing!","Lovely smile!","Super friend!","Brilliant!","You’re a star!","So kind!","Keep going!","Sweetest person ever!"];
function spawn(){
  var b=document.createElement("button");
  b.className="balloon";b.textContent=kind[Math.floor(Math.random()*kind.length)];
  b.setAttribute("aria-label","Pop");
  b.style.left=Math.random()*85+"%";
  b.style.animationDuration=(4+Math.random()*3)+"s";
  b.onclick=function(ev){
    if(!running)return;
    score++;$("score").textContent=score;
    $("toast").textContent=praise[Math.floor(Math.random()*praise.length)];
    burst(ev.clientX,ev.clientY);b.remove();
  };
  b.onanimationend=function(){b.remove()};
  $("arena").appendChild(b);
}
function end(){
  running=false;clearInterval(tick);clearInterval(spawner);
  $("arena").innerHTML="";
  $("toast").textContent="You popped "+score+"! "+(score>=15?"Champion, "+NAME+"! 🏆":"Nicely done, "+NAME+"! 🎉");
  $("start").textContent="Play again";$("start").style.display="";
  var r=$("arena").getBoundingClientRect();
  for(var i=0;i<4;i++)burst(r.left+r.width*(.2+.2*i),r.top+r.height/2);
}
$("start").onclick=function(){
  score=0;left=25;running=true;
  $("score").textContent=0;$("time").textContent=left;$("toast").textContent="";
  $("start").style.display="none";
  spawn();spawner=setInterval(spawn,650);
  tick=setInterval(function(){left--;$("time").textContent=left;if(left<=0)end()},1000);
};

// Smile button
var last=-1;
$("smileBtn").onclick=function(e){
  var n;do{n=Math.floor(Math.random()*COMPLIMENTS.length)}while(n===last);
  last=n;$("smile").textContent=COMPLIMENTS[n];
  burst(e.clientX,e.clientY);
};
</script>
</body>
</html>
